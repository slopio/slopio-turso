[package]
name = "slopio-turso"
version = "0.1.0"
edition = "2024"

[dependencies]
io-uring = "0.7.15"
rustc-hash = "2.1"
slopio = { package = "runtime", git = "ssh://git@github.com/slopio/slopio.git", branch = "main" }
turso_core = { version = "=0.8.1", default-features = false, features = ["fs", "json", "uuid", "io_uring", "conn_raw_api"] }

[dev-dependencies]
# examples/engines.rs: the same workload on SQLite, to compare.
rusqlite = { version = "0.37", features = ["bundled"] }

# A panic stops the process at once, without running a destructor: nothing
# can answer a write that was not committed, and no unwind goes through
# slopio's runtime. Tests and benches ignore it: libtest needs to unwind.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
