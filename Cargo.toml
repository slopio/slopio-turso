[package]
name = "slopio-turso"
version = "0.1.0"
edition = "2024"

[dependencies]
bumpalo = { version = "3.20.3", features = ["collections"] }
self_cell = "1.2.2"
slopio = { package = "runtime", git = "ssh://git@github.com/slopio/slopio.git", branch = "main" }
turso_core = { version = "=0.8.1", default-features = false, features = ["fs", "json", "uuid", "io_uring"] }
